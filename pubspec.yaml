name: ai_chat_assistant
description: A mobile AI chat client with local conversation history.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  bloc_concurrency: ^0.3.0
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_markdown_plus: ^1.0.12
  flutter_secure_storage: ^11.2.0
  fpdart: ^1.2.0
  path: ^1.9.1
  sqflite: ^2.4.6
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.7

flutter:
  uses-material-design: true
